services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inquiry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inquiry_password}
      POSTGRES_DB: ${POSTGRES_DB:-inquiry_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inquiry_user} -d ${POSTGRES_DB:-inquiry_management}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
